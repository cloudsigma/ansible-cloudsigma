name: Offline installed SDK qualification
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '${{ matrix.python }}'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: cloudsigma/pycloudsigma
          ref: e59a412db46ae5de466e78d622140b0fd6bf93c3
          path: sdk-source
          persist-credentials: false
      - name: Install hashlocked build and runtime dependencies
        run: python -m pip --isolated install --index-url https://pypi.org/simple --require-hashes -r ci/requirements-${{ matrix.python }}.lock
      - name: Build and install exact SDK
        run: |
          python -m build --no-isolation --wheel sdk-source --outdir sdk-dist
          python -m pip --isolated install --no-index --no-deps sdk-dist/*.whl
      - name: Offline finite suite
        timeout-minutes: 3
        run: python -I -B ci/run_offline.py
